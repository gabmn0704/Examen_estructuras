<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Caso de Estudio 3 - Gestión urbana de mensajería</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f4f6;color:#171717}.app{max-width:1100px;margin:auto;padding:24px}header{background:#111;color:white;border-radius:18px;padding:26px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:8px 0;font-size:30px}h2{margin-top:0}.tag{font-size:12px;letter-spacing:1.5px;background:#333;padding:7px 10px;border-radius:20px}header p{margin:0;color:#ccc}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;background:#e5e7eb;font-weight:700}button:hover{filter:brightness(.95)}header button{background:white;color:#111}nav{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}nav button.active,.primary{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card,article{background:white;border-radius:16px;padding:22px;box-shadow:0 3px 12px #0000000b}input:not([type=checkbox]){display:block;width:100%;padding:12px;margin:10px 0;border:1px solid #d1d5db;border-radius:9px;font-size:15px}.big{font-size:35px;font-weight:800;margin:5px 0 18px}.big small{font-size:14px;font-weight:400;color:#666}.item{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:9px 0}.item b,.item span{display:block}.item span{font-size:13px;color:#666;margin-top:4px}.route{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stop{padding:14px;border:1px solid #ddd;border-radius:12px;min-width:130px;background:#fafafa}.stop b{display:block;font-size:12px;color:#777}.stop.selected{border:2px solid #111;background:#eee}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.stats div{background:#f3f4f6;border-radius:12px;padding:18px;min-width:150px}.stats b,.stats span{display:block}.stats b{font-size:26px}.stats span{color:#666;margin-top:5px}.log{border-left:3px solid #111;padding-left:10px;color:#444}footer{text-align:center;color:#777;font-size:12px;padding:22px}label{font-size:14px;color:#444} @media(max-width:700px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Versión autónoma: NO necesita Node, npm, React ni localhost.
class DoublyLinkedList{constructor(){this.items=[]}add(v){this.items.push(v)}insert(i,v){this.items.splice(i,0,v)}remove(i){return this.items.splice(i,1)[0]}get(i){return this.items[i]}get size(){return this.items.length}toArray(){return [...this.items]}}
class Queue{constructor(){this.items=[]}enqueue(v){this.items.push(v)}dequeue(){return this.items.shift()}get size(){return this.items.length}toArray(){return [...this.items]}}
class Stack{constructor(){this.items=[]}push(v){this.items.push(v)}pop(){return this.items.pop()}get size(){return this.items.length}toArray(){return [...this.items].reverse()}}
class DeliverySystem{
constructor(){this.reset()}
reset(){this.route=new DoublyLinkedList();['Centro','San Juan','Las Cuadras','La Aurora','Bomboná'].forEach(x=>this.route.add(x));this.inbox=new Queue();this.trunk=new Stack();this.log=[];this.nextId=1;this.current=0;this.closed=false;this.seed()}
seed(){this.addMessage('Centro','Ana Pérez','Documentos');this.addMessage('La Aurora','Carlos Ruiz','Paquete pequeño');this.addMessage('San Juan','María López','Carta');this.log.unshift('Sistema inicializado con datos de ejemplo.')}
addMessage(address,recipient,content){this.inbox.enqueue({id:this.nextId++,address,recipient,content,status:'Pendiente'});this.log.unshift('Mensaje #'+(this.nextId-1)+' recibido para '+address+'.')}
move(dir){if(!this.route.size)return;this.current=Math.max(0,Math.min(this.route.size-1,this.current+dir));this.log.unshift('Ruta: vehículo en '+this.route.get(this.current)+'.')}
insertStop(name){if(!name.trim())return;this.route.insert(this.current+1,name.trim());this.log.unshift('Parada insertada: '+name.trim()+'.')}
deleteStop(){if(this.route.size<=1)return;const r=this.route.remove(this.current);this.current=Math.min(this.current,this.route.size-1);this.log.unshift('Parada eliminada: '+r+'.')}
loadNext(){const m=this.inbox.dequeue();if(!m)return;m.status='En reparto';this.trunk.push(m);this.log.unshift('Mensaje #'+m.id+' cargado al maletero.')}
deliverTop(ok){const m=this.trunk.pop();if(!m)return;m.status=ok?'Entregado':'Fallido';this.log.unshift('Mensaje #'+m.id+': '+m.status+'.')}
close(){this.closed=true;this.log.unshift('Jornada cerrada.')}
}
const sys=new DeliverySystem();let tab='inicio',ok=true;
function render(){const a=document.getElementById('app');let body='';
if(tab==='inicio')body=`<section class="grid"><article><h2>Recibir mensaje</h2><input id="address" placeholder="Dirección / parada"><input id="recipient" placeholder="Destinatario"><input id="content" placeholder="Contenido"><button class="primary" onclick="addMsg()">Agregar a la cola</button></article><article><h2>Cola FIFO</h2><p class="big">${sys.inbox.size} <small>mensajes pendientes</small></p>${sys.inbox.toArray().map(m=>`<div class="item"><b>#${m.id} · ${m.recipient}</b><span>${m.address} — ${m.status}</span></div>`).join('')||'<p>No hay mensajes pendientes.</p>'}</article></section>`;
if(tab==='ruta')body=`<section class="card"><h2>Editor de ruta</h2><div class="route">${sys.route.toArray().map((x,i)=>`<div class="stop ${i===sys.current?'selected':''}"><b>${i+1}</b><span>${x}</span></div>`).join('')}</div><p>Ubicación actual: <strong>${sys.route.get(sys.current)}</strong></p><div class="actions"><button onclick="act(()=>sys.move(-1))">← Anterior</button><button onclick="act(()=>sys.move(1))">Siguiente →</button><button onclick="insertStop()">+ Insertar</button><button onclick="act(()=>sys.deleteStop())">Eliminar actual</button></div></section>`;
if(tab==='maletero')body=`<section class="card"><h2>Maletero — pila LIFO</h2><p>La última pieza cargada es la primera que se entrega.</p><button class="primary" onclick="act(()=>sys.loadNext())">Cargar siguiente de la cola</button><div class="actions"><button onclick="act(()=>sys.deliverTop(ok))">Entregar (${ok?'éxito':'fallo'})</button><label><input type="checkbox" ${!ok?'checked':''} onchange="ok=!this.checked;render()"> marcar entrega como fallida</label></div>${sys.trunk.toArray().map(m=>`<div class="item"><b>#${m.id} · ${m.recipient}</b><span>${m.address} — ${m.status}</span></div>`).join('')||'<p>El maletero está vacío.</p>'}</section>`;
if(tab==='reportes')body=`<section class="card"><h2>Cierre y bitácora</h2><div class="stats"><div><b>${sys.inbox.size}</b><span>En cola</span></div><div><b>${sys.trunk.size}</b><span>En maletero</span></div><div><b>${sys.closed?'Sí':'No'}</b><span>Jornada cerrada</span></div></div><button class="primary" onclick="act(()=>sys.close())">Cerrar jornada</button><h3>Bitácora</h3>${sys.log.map(x=>`<p class="log">${x}</p>`).join('')}</section>`;
a.innerHTML=`<header><div><span class="tag">CASO DE ESTUDIO 3</span><h1>Gestión urbana de mensajería</h1><p>Aplicación en TypeScript · versión ejecutable directamente desde index.html.</p></div><button onclick="act(()=>sys.reset())">Reiniciar</button></header><nav><button class="${tab==='inicio'?'active':''}" onclick="tab='inicio';render()">Bandeja</button><button class="${tab==='ruta'?'active':''}" onclick="tab='ruta';render()">Ruta</button><button class="${tab==='maletero'?'active':''}" onclick="tab='maletero';render()">Maletero</button><button class="${tab==='reportes'?'active':''}" onclick="tab='reportes';render()">Cierre y reportes</button></nav><main>${body}</main><footer>TypeScript + estructuras: lista doblemente enlazada, cola FIFO y pila LIFO.</footer>`}
function act(fn){fn();render()}function addMsg(){const address=document.getElementById('address').value.trim(),recipient=document.getElementById('recipient').value.trim(),content=document.getElementById('content').value.trim()||'Sin contenido';if(!address||!recipient){alert('Escribe la dirección y el destinatario.');return}sys.addMessage(address,recipient,content);render()}function insertStop(){const n=prompt('Nombre de la nueva parada:');if(n)act(()=>sys.insertStop(n))}render();
</script>
</body></html>
